name: Update store photos and links

# Runs on demand (Actions tab → "Run workflow") and every Monday.
# Needs repository secrets: ALIEXPRESS_APP_KEY, ALIEXPRESS_APP_SECRET, ALIEXPRESS_TRACKING_ID,
# and for Awin: AWIN_API_TOKEN (plus AWIN_PUBLISHER_ID, optional).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: aliexpress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch photos and affiliate links
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: python scripts/aliexpress_fetch.py

      - name: Fetch Awin store photos and links
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
        run: python scripts/awin_fetch.py

      - name: Cache the background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use

      - name: Make clean product cut-outs
        run: |
          pip install --quiet "rembg[cpu]" pillow
          python scripts/clean_photos.py

      - name: Rebuild the site
        run: python scripts/build_site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aliexpress.json data/aliexpress_review.csv data/photo_cache.json docs/
          git add data/awin.json data/awin_review.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update store photos and links"
            git push
          fi
