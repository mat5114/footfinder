<title>Footfinder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: one screen, no scrolling. Header, then a cloud of shoe photos that fills whatever height is left (spaced so none overlap), then the quiz card. Results page through instead of scrolling. */
:root{
  --bg:#F5F5F4; --card:#FFFFFF; --tile:#F5F5F4; --tile-hover:#EDEDEB;
  --ink:#292524; --muted:#78716C; --faint:#A8A29E; --line:#E7E5E4; --sel:#292524;
  --shadow:0 1px 2px rgb(28 25 23 / .04),0 4px 12px rgb(28 25 23 / .05),0 16px 40px rgb(28 25 23 / .06);
  --font:"Inter","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(0.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1917; --card:#292524; --tile:#33302D; --tile-hover:#3D3936;
  --ink:#F5F5F4; --muted:#A8A29E; --faint:#78716C; --line:#3D3936; --sel:#F5F5F4;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 16px 40px rgb(0 0 0 / .35); color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#1C1917; --card:#292524; --tile:#33302D; --tile-hover:#3D3936;
  --ink:#F5F5F4; --muted:#A8A29E; --faint:#78716C; --line:#3D3936; --sel:#F5F5F4;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 16px 40px rgb(0 0 0 / .35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px}
button{font:inherit;color:inherit}
.top{flex:none;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:1200px;margin:0 auto;position:relative;z-index:3}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo svg{flex:none}
.lang{position:relative;justify-self:center}
.lbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink);transition-property:background-color,scale;transition-duration:.15s}
.lbtn:hover{background:var(--line)}
.lbtn:active{scale:.96}
.lmenu{position:absolute;top:calc(100% + 6px);left:50%;translate:-50% 0;margin:0;padding:4px;list-style:none;min-width:160px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);z-index:10}
.lmenu li{all:unset;display:flex;justify-content:space-between;align-items:center;gap:10px;box-sizing:border-box;width:100%;cursor:pointer;padding:7px 10px;border-radius:8px;font-size:13px}
.lmenu li:hover,.lmenu li:focus-visible{background:var(--tile);outline:none}
.lmenu li[aria-selected="true"]{font-weight:600}
.lmenu li[aria-selected="true"]::after{content:"✓";font-size:12px}
.lmenu li small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.cfoot>:last-child{justify-self:end}
.about{all:unset;cursor:pointer;justify-self:end;font-size:12.5px;color:var(--ink)}
.about:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* cloud */
.cloud{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:1200px;margin:6px auto 0}
.shoe{position:absolute;left:50%;top:50%;width:var(--w);translate:-50% -50%;
  transition-property:left,top,width,opacity,filter;transition-duration:.7s;transition-timing-function:var(--ease);
  filter:grayscale(1) contrast(.9);opacity:.5;text-align:center;pointer-events:none}
.shoe svg,.shoe .photo{width:100%;height:auto;display:block}
.photo{object-fit:contain;background:transparent;filter:drop-shadow(0 6px 8px rgb(0 0 0 / .08))}
.store.live{color:var(--ink);background:var(--card);text-decoration:none;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);transition-property:background-color,scale;transition-duration:.15s}
.store.live:hover{background:var(--tile-hover)}
.store.live:active{scale:.96}
.shoe.feat{filter:none;opacity:1}
.shoe.gone{opacity:0}
.shoe .cap{font-size:11.5px;line-height:1.3;margin-top:2px;opacity:0;transition:opacity .3s var(--ease)}
.shoe.feat .cap{opacity:1}
.shoe .cap{width:100%;white-space:nowrap}
.cap b,.cap span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap b{font-weight:600;font-size:12px}
.cap span{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){.cap b{font-size:11px}.cap span{font-size:10.5px}}
.go{white-space:nowrap}

/* card */
.card{position:relative;z-index:2;flex:none;width:100%;max-width:560px;margin:6px auto 0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px}
.card.wide{max-width:920px}
.chead{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:6px 4px 12px}
.icons{display:flex;gap:2px}
.ibtn{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted);transition-property:background-color,color,scale;transition-duration:.15s}
.ibtn:hover{background:var(--tile);color:var(--ink)}
.ibtn:active{scale:.96}
.ibtn[disabled]{opacity:.3;pointer-events:none}
h1{margin:0;text-align:center;font-size:21px;font-weight:700;letter-spacing:-.022em;line-height:1.2;text-wrap:balance}
.hint{margin:-4px 0 12px;text-align:center;color:var(--muted);font-size:13px;text-wrap:pretty;padding-inline:12px}
.opts{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:6px}
@media (max-width:520px){.opts{--cols:2!important}}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--tile);border-radius:10px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;min-height:64px;
  transition-property:background-color,box-shadow,scale;transition-duration:.15s}
.opt:hover{background:var(--tile-hover)}
.opt:active{scale:.96}
.opt.sel{box-shadow:inset 0 0 0 1.5px var(--sel)}
.opt b{font-weight:600;font-size:13.5px;letter-spacing:-.005em;line-height:1.25}
.opt span{font-size:12px;color:var(--muted);line-height:1.3}
.opt .art{width:100%;max-width:120px;height:58px;display:grid;place-items:center;margin-bottom:6px}
.opt .art svg,.opt .art .photo{max-height:58px;width:auto;max-width:100%}
.opt .num{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-bottom:2px}
.opt .num small{font-size:13px;font-weight:600;margin-left:2px}
.cfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 6px 2px;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.go{all:unset;cursor:pointer;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;transition-property:scale,opacity;transition-duration:.15s}
.go:active{scale:.96}

/* results */
.filters{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:-2px 0 12px}
.chip{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;color:var(--muted);transition-property:background-color,color;transition-duration:.15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--tile);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--tile);border-radius:10px;padding:12px 16px 12px 10px}
@media (max-width:600px){.row{grid-template-columns:96px minmax(0,1fr);}.row .pct{grid-column:2;justify-self:start;text-align:left}}
.row .pic svg,.row .pic .photo{width:100%;height:auto;display:block}

.rbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.rname{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.rname b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.rname .br{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--card);color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.specs em{font-style:normal;color:var(--ink);font-weight:500}
.why{font-size:12.5px;color:var(--ink);margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.why li{background:var(--card);border-radius:6px;padding:2px 7px}
.buy{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.price{font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.store{font-size:12px;padding:4px 9px;border-radius:7px;background:var(--card);color:var(--faint)}
.sim{font-size:12px;color:var(--muted)}
.sim button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px}
.pct{text-align:right;font-variant-numeric:tabular-nums}
.pct strong{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1}
.pct span{font-size:11px;color:var(--muted)}
.row.hi{box-shadow:inset 0 0 0 1.5px var(--sel)}
.note{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 48px);right:max(16px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 32px));margin:0;padding:14px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.empty{text-align:center;color:var(--muted);padding:20px}
.opts.compact .opt{min-height:40px;padding:9px 8px}
@media (max-width:520px){.opts.compact{--cols:3!important}}
@media (max-height:780px){
  h1{font-size:19px}.chead{padding:4px 4px 8px}.hint{margin-bottom:8px}
  .opt{padding:10px 8px 9px;min-height:50px}.opt .art{height:44px;margin-bottom:4px}.opt .art svg,.opt .art .photo{max-height:44px}
  .opt .num{font-size:19px}.cfoot{padding-top:8px}
}
@media (max-height:640px){.opt .art{display:none}.opt span{display:none}}

/* results: a product page for the selected shoe, with the shortlist beside it (one screen, no scrolling) */
.card.res{flex:1 1 auto;min-height:0;max-width:1240px;background:transparent;box-shadow:none;padding:0;margin-top:10px}
.rwrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.rmain{min-height:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden}
.rphoto{position:relative;background:var(--tile);display:grid;place-items:center;padding:28px;min-height:0}
.rphoto svg,.rphoto .photo{width:min(100%,460px);height:auto;max-height:100%;display:block}
.rphoto .photo{filter:drop-shadow(0 22px 22px rgb(0 0 0 / .16))}
.rbadge{position:absolute;top:18px;left:18px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card);font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.rdet{min-height:0;display:flex;flex-direction:column;gap:14px;padding:30px 34px}
.rdet .rb{font-size:13px;color:var(--muted);font-weight:500}
.rdet h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.rprice{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.rprice small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--tile);border-radius:12px;padding:10px 14px}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{font-size:18px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.spec{margin:0;display:grid;grid-template-columns:auto 1fr;font-size:13.5px}
.spec dt,.spec dd{margin:0;padding:6px 0;border-top:1px solid var(--line)}
.spec dt{color:var(--muted);padding-right:16px}
.spec dd{text-align:right;font-variant-numeric:tabular-nums}
.spec dt:first-of-type,.spec dd:first-of-type{border-top:0}
.rwhy{display:flex;flex-wrap:wrap;gap:4px}
.rwhy span{font-size:12px;background:var(--tile);border-radius:6px;padding:2px 8px}
.rbtns{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.rbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;transition-property:scale,opacity,background-color;transition-duration:.15s}
.rbtn:active{scale:.96}
.rbtn.light{background:var(--tile);color:var(--ink)}
.rbtn.dark{background:var(--ink);color:var(--bg)}
.rbtn.off{opacity:.45;cursor:default;pointer-events:none}
.rlist{min-height:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.rlhead{display:flex;align-items:center;gap:6px;padding:12px 12px 8px}
.rlhead b{flex:1;font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:right;padding-right:6px}
.ritem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;height:64px;transition:background-color .15s}
.ritem:hover{background:var(--tile)}
.ritem[aria-current="true"]{background:var(--tile)}
.ritem .th{height:44px;display:grid;place-items:center}
.ritem .th svg,.ritem .th .photo{max-height:44px;width:auto;max-width:58px}
.ritem .tx{min-width:0}
.ritem .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .tx span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rtag{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:7px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.rpager{display:none}
@media (max-height:820px){.rdet{padding:22px 26px;gap:10px}.rdet h2{font-size:24px}.rprice{font-size:20px}.tile b{font-size:16px}.spec dt,.spec dd{padding:4px 0}.rbtn{height:42px}}
@media (max-height:700px){.spec .x{display:none}.rwhy{display:none}}
@media (max-width:900px){
  .rwrap{grid-template-columns:minmax(0,1fr)}
  .rlist{display:none}
  .rmain{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rphoto{padding:12px 16px;height:clamp(110px,24vh,210px)}
  .rphoto svg,.rphoto .photo{width:auto;max-width:78%;max-height:100%}
  .rdet{padding:14px 18px 14px;gap:8px}
  .rdet h2{font-size:21px}.rprice{font-size:18px}
  .tile{padding:8px 12px}.tile b{font-size:15px}
  .spec{font-size:13px}.spec dt,.spec dd{padding:3px 0}
  .rwhy{display:none}
  .rbtn{height:42px}
  .rpager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
  .rpager span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
}
@media (max-width:900px) and (max-height:760px){.spec .x{display:none}}
@media (max-width:900px) and (max-height:620px){.spec .y{display:none}.rphoto{height:96px}}
/* results: a page of cards at a time instead of a long list */
.rgrid{display:grid;grid-template-columns:repeat(var(--per,3),minmax(0,1fr));gap:8px}
.rcard{position:relative;background:var(--tile);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard .pic{height:84px;display:grid;place-items:center}
.rcard .pic svg,.rcard .pic .photo{max-height:84px;width:auto;max-width:100%;display:block}
.rcard .badge{position:absolute;top:10px;right:10px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font-variant-numeric:tabular-nums}
.rcard .rname{padding-right:52px}
.pager{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
@media (max-height:700px){.rcard .pic{height:60px}.rcard .pic svg,.rcard .pic .photo{max-height:60px}.rcard .why{display:none}}
@media (prefers-reduced-motion:reduce){.shoe,.card,.opt,.ibtn{transition-duration:0s!important}}
</style>

<div class="top">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 15.5c3.5 0 4.8-7 9-7 3.6 0 3.8 3 8.5 3v3.3c0 1.3-.8 2.2-2.2 2.2H3.6C2.6 17 2 16.4 2 15.5z" fill="currentColor"/></svg>Footfinder</div>
  <div class="lang"><button class="lbtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.8 1.9 2.6 4 2.6 6.25S9.8 12.35 8 14.25C6.2 12.35 5.4 10.25 5.4 8S6.2 3.65 8 1.75z"/></svg><span id="langCur"></span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m2.5 4 2.5 2.5L7.5 4"/></svg></button><ul class="lmenu" id="langMenu" role="listbox" hidden></ul></div>
  <button class="about" id="aboutBtn"></button>
</div>
<div class="cloud" id="cloud" aria-hidden="true"></div>
<section class="card" id="card" aria-live="polite"></section>
<p class="note" id="note" hidden></p>

let autoSurf=false;

/* ---------- scoring ---------- */
let L="en";try{const sv=localStorage.getItem("fdf-lang");if(LANGS.some(x=>x[0]===sv))L=sv}catch(e){}
const A={};let step=0,view="quiz",lovedStage=0,lovedBrand=null,filt="all",hi=null;
const t=k=>T[L][k];
const FX={firm:0,balanced:1,soft:2,bouncy:3},FO={EVA:0,sEVA:.25,TPU:.35,blend:.35,TPEE:.5,PEBA:.65};
const feelX=s=>FX[s.feel]+FO[s.ftype];
function scoreShoe(s,strict){
  if(strict&&!hardOk(s))return null;
  let sc=50,w=[];const add=(n,k)=>{sc+=n;if(k&&n>=8)w.push([n,k])};
  const surf=A.surface==="trail"||A.goal==="trail"?"trail":A.surface;
  if(surf==="trail"){if(s.surf==="road")return null;add(s.surf==="trail"?10:4,"trail")}
  else if(surf==="road"||surf==="treadmill"){if(s.surf==="trail")return null;if(s.surf==="mixed")add(-6)}
  else if(surf==="mixed"){if(s.surf==="mixed")add(10,"mixed");else if(s.surf==="trail")add(2)}
  const c=s.cats,has=x=>c.includes(x);
  if(A.goal==="start"){if(has("race"))add(-30);if(s.plate!=="none")add(-12);if(has("daily")||has("budget")||has("stab"))add(9,"start")}
  if(A.goal==="daily"){if(has("daily"))add(12,"daily");if(has("race")&&c.length<=2)add(-15)}
  if(A.goal==="fast"){if(has("tempo"))add(12,"fast");if(has("race"))add(A.distance==="21k"||A.distance==="42k"?14:8,"fast");if(has("recovery")&&!has("tempo"))add(-8)}
  if(A.volume==="v3"){if(s.h>=35)add(6);if(has("budget"))add(-6);if(has("long"))add(8,"long")}
  if(A.volume==="v0"&&has("budget"))add(4);
  if(A.distance){const dd=A.distance==="none"?"5k":A.distance,longD=dd==="42k"||dd==="ultra";if(s.dist.includes(dd))add(longD?8:5,longD?"dist":null);else add(-10)}
  if(A.weight==="w3"||A.weight==="w4"){if(s.heavy)add(A.weight==="w4"?12:9,"heavy");else add(-8);if(s.g<200)add(-10);if(s.h<32)add(-6)}
  if(A.weight==="w1"&&s.g<260)add(4);
  if(A.feel==="soft"){if(s.feel==="soft")add(12,"soft");else if(s.feel==="bouncy")add(5);else if(s.feel==="firm")add(-10)}
  if(A.feel==="bouncy"){if(s.feel==="bouncy")add(12,"bouncy");else if(s.feel==="soft")add(4);else if(s.feel==="firm")add(-8)}
  if(A.feel==="firm"){if(s.feel==="firm")add(12,"firm");else if(s.feel==="balanced")add(6);else if(s.feel==="soft")add(-8)}
  if(A.width==="tight"){if(roomy(s))add(s.brand==="Altra"||s.brand==="Topo Athletic"?14:12,"wide");else add(-6)}
  if(A.width==="some"&&roomy(s))add(5);
  if(A.wear==="in"){if(s.stab==="stable")add(16,"stab");else add(-4)}
  if(A.wear==="out"||A.wear==="even"){if(s.stab==="stable")add(-4);else add(3)}
  if(A.budget){const lim={b1:100,b2:160,b3:220,b4:1e9,b4x:1e9}[A.budget];if(s.usd>lim*1.1)return null;if(lim<1e9&&s.usd<=lim)add(A.budget==="b1"?8:4,A.budget==="b1"?"budget":null);if(!s.cur&&lim<1e9)add(3)}
  if(A.cn==="no"&&s.cn)return null;
  if(A.loved&&A.loved.i!=null&&A.loved.like!=null){const L0=S[A.loved.i];
    if(s.i===A.loved.i){if(A.loved.like)add(-4);else return null}
    else{const d=Math.abs(s.h-L0.h)/6+Math.abs(s.drop-L0.drop)/4+Math.abs(s.g-L0.g)/40+Math.abs(feelX(s)-feelX(L0))+(s.plate!==L0.plate?1:0);
      const near=L0.sim.includes(s.i);
      if(A.loved.like)add(near?18:Math.max(0,10-d*3),near||d<1.2?"like":null);else add(near?-16:Math.min(0,-8+d*3))}}
  if(!s.cur)add(-3);
  if(!Object.keys(A).length&&s.pop)sc+=5;
  return{sc,w:w.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)};
}
/* hard rules: an answer rules shoes out instead of only nudging the score */
const roomy=s=>s.wide||s.brand==="Altra"||s.brand==="Topo Athletic";
function hardOk(s){
  const c=s.cats,has=x=>c.includes(x);
  if(A.goal==="start"&&(has("race")||s.plate==="carbon"||s.plate==="carbon_rods"))return false;
  if(A.goal==="daily"&&!(has("daily")||has("long")||has("stab")))return false;
  if(A.goal==="fast"&&!(has("tempo")||has("race")))return false;
  if(A.volume==="v0"&&has("race"))return false;
  if(A.volume==="v3"&&has("budget")&&!has("tempo"))return false;
  const dist=A.distance==="none"?"5k":A.distance;
  if(dist&&!s.dist.includes(dist))return false;
  if(!carbonOk()&&(s.plate==="carbon"||s.plate==="carbon_rods"||has("race")))return false;
  if((A.weight==="w3"||A.weight==="w4")&&(s.g<215||s.h<32))return false;
  if(A.weight==="w4"&&!s.heavy&&!has("long"))return false;
  if(A.feel==="soft"&&s.feel==="firm")return false;
  if(A.feel==="firm"&&(s.feel==="soft"||s.feel==="bouncy"))return false;
  if(A.feel==="bouncy"&&s.feel==="firm")return false;
  if(A.width==="tight"&&!roomy(s))return false;
  if(A.wear==="in"&&s.stab==="neutral")return false;
  if((A.wear==="out"||A.wear==="even")&&s.stab==="stable")return false;
  return true;
}
/* one entry per model line (Ghost 16/17/18 → best one), max 2 per brand, only shoes close to the top score */
const line=s=>s.brand+"|"+s.model.replace(/v\d+$/i,"").split(" ").filter(w=>!/^v?\d+(\.\d+)?$/i.test(w)).join(" ");
function finalize(list,cut=true,max){
  const n=answered(),seen=new Set(),per={},out=[];
  max=max||(n>=Q.length-2||view==="results"?12:34);
  const top=list.length?scores[list[0].i].sc:0;
  for(const s of list){
    if(out.length>=max)break;
    if(cut&&n>=4&&scores[s.i].sc<top-22)break;
    const ln=line(s);if(seen.has(ln))continue;
    if((per[s.brand]||0)>=2)continue;
    seen.add(ln);per[s.brand]=(per[s.brand]||0)+1;out.push(s);
  }
  return out;
}
let ranked=[],pool=[],scores=[];
function recompute(){
  const run=strict=>{scores=S.map(s=>scoreShoe(s,strict));pool=S.filter(s=>scores[s.i]).sort((a,b)=>scores[b.i].sc-scores[a.i].sc||b.cur-a.cur||b.pop-a.pop||b.yr-a.yr)};
  run(true);ranked=finalize(pool);
  if(answered()>=3&&ranked.length<4){run(false);ranked=finalize(pool)}
}
const answered=()=>Object.keys(A).filter(k=>k!=="loved"||A.loved.like!=null).length;

/* ---------- cloud ---------- */
const cloud=document.getElementById("cloud"),els=new Map();
/* Slots for the cloud, sized to the space left above the card. Featured shoes sit in a row in
   the middle; smaller ones go on a jittered grid around them, with a gap so nothing overlaps.
   Slots closest to the middle come first, so better matches sit nearer the featured row. */
let slotCache=null;
function slots(){
  const W=cloud.clientWidth,H=cloud.clientHeight,key=W+"x"+H;
  if(slotCache&&slotCache.key===key)return slotCache.out;
  const out=[],gap=W<640?14:22,boxes=[];
  if(H<70||W<200){slotCache={key,out};return out}
  let fw=Math.min(200,W*0.27,(H*0.62-30)/0.55);
  const nf=fw>=86?3:0;
  if(nf){
    const fh=fw*0.55+30,cy=H*0.5;
    [0,-1,1].forEach(d=>{const cx=W/2+d*(fw+gap*1.6);out.push([cx/W,cy/H,fw]);boxes.push([cx-fw/2-gap,cy-fh/2-gap,cx+fw/2+gap,cy+fh/2+gap])});
  }
  const sw=Math.max(40,Math.min(86,(nf?fw*0.44:Math.min(W,H*1.8)*0.16))),sh=sw*0.6;
  let seed=W*7+H*13;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const cw=sw+gap,ch=sh+gap,cols=Math.floor(W/cw),rows=Math.floor(H/ch),cand=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=(c+.5)*(W/cols)+(rnd()-.5)*gap*.8,y=(r+.5)*(H/rows)+(rnd()-.5)*gap*.6;
    const bx=[x-sw/2,y-sh/2,x+sw/2,y+sh/2];
    if(boxes.some(o=>bx[0]<o[2]&&bx[2]>o[0]&&bx[1]<o[3]&&bx[3]>o[1]))continue;
    cand.push([x,y]);
  }
  cand.sort((p,q)=>Math.hypot(p[0]-W/2,(p[1]-H/2)*1.6)-Math.hypot(q[0]-W/2,(q[1]-H/2)*1.6));
  cand.slice(0,30).forEach(([x,y])=>out.push([x/W,y/H,sw]));
  slotCache={key,out,nf};return out;
}
function drawCloud(){
  cloud.hidden=view==="results";if(view==="results")return;
  const sl=slots(),nf=(slotCache&&slotCache.nf)||0;const list=(view==="results"&&filt!=="all"?filtered():ranked).slice(0,sl.length);
  const keep=new Set();
  list.forEach((s,k)=>{keep.add(s.i);let el=els.get(s.i);const [x,y,w]=sl[k];
    if(!el){el=document.createElement("div");el.className="shoe gone";el.innerHTML=shoeArt(s)+`<div class="cap"><b></b><span></span></div>`;
      el.style.left=x*100+"%";el.style.top=(y*100+4)+"%";el.style.setProperty("--w",w+"px");cloud.appendChild(el);els.set(s.i,el);el.getBoundingClientRect()}
    el.classList.remove("gone");el.classList.toggle("feat",k<nf);
    el.style.left=x*100+"%";el.style.top=y*100+"%";el.style.setProperty("--w",w+"px");
    el.querySelector(".cap b").textContent=s.brand+" "+s.model;
    el.querySelector(".cap span").textContent=s.g+" g · drop "+s.drop+" mm";
  });
  els.forEach((el,i)=>{if(!keep.has(i)&&!el.classList.contains("gone")){el.classList.add("gone");el.classList.remove("feat");
    setTimeout(()=>{if(el.classList.contains("gone")){el.remove();els.delete(i)}},750)}});
}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==="results")renderResults();drawCloud()},120)});

const card=document.getElementById("card");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svgBack=`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4 3 8l4 4"/></svg>`;
const svgReset=`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3"/></svg>`;
function head(title,backOk){return `<div class="chead"><div class="icons"><button class="ibtn" id="back" aria-label="${t("back")}" ${backOk?"":"disabled"}>${svgBack}</button><button class="ibtn" id="reset" aria-label="${t("reset")}" ${answered()?"":"disabled"}>${svgReset}</button></div><h1>${esc(title)}</h1><div></div></div>`}
function foot2(extra){
  return `<div class="cfoot"><span class="sp"></span><div class="dots">${Q.map((q,i)=>active(i)?`<i class="${i<=step||view==="results"?"on":""}"></i>`:"").join("")}</div>${extra||"<span></span>"}</div>`}
function renderQuiz(){
  card.classList.remove("wide","res");
  const q=Q[step];let h="";
  if(q.special){h=head(qTitle(q),true)+renderLoved()+foot2(`<button class="go" id="finish">${t("next")}</button>`)}
  else{
    const opts=vis(q);
    h=head(qTitle(q),prevIdx(step)>=0);
    if(qHint(q))h+=`<p class="hint">${esc(qHint(q))}</p>`;
    h+=`<div class="opts" style="--cols:${Math.min(opts.length,opts.length===6?3:5)}">`+opts.map(o=>{const [lab,sub]=qo(q.id+"."+o[0]);
      const art=o[1]?`<div class="art">${o[1]()}</div>`:o[2]?`<div class="num">${esc(o[2])}${/^[\d<]/.test(o[2])&&q.id!=="budget"?`<small>${q.id==="weight"?"kg":"km"}</small>`:""}</div>`:"";
      return `<button class="opt ${A[q.id]===o[0]?"sel":""}" data-v="${o[0]}">${art}<b>${esc(lab)}</b>${sub?`<span>${esc(sub)}</span>`:""}</button>`}).join("")+`</div>`;
    h+=foot2(A[q.id]?`<button class="go" id="fwd">→</button>`:"<span></span>");
  }

  requestAnimationFrame(drawCloud); // the card height changed, so the space for the cloud did too
}
function wire(q){
  card.querySelectorAll(".opt[data-v]").forEach(b=>b.onclick=()=>{A[q.id]=b.dataset.v;
    sanitize();recompute();drawCloud();const nx=nextIdx(step);if(nx<0){finish();return}step=nx;lovedStage=0;renderQuiz()});
  card.querySelectorAll("[data-brand]").forEach(b=>b.onclick=()=>{lovedBrand=b.dataset.brand;lovedStage=1;renderQuiz()});
  card.querySelectorAll("[data-shoe]").forEach(b=>b.onclick=()=>{A.loved={i:+b.dataset.shoe,like:null};lovedStage=2;renderQuiz()});
  card.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>{A.loved.like=b.dataset.like==="1";finish()});
  card.querySelectorAll("[data-none]").forEach(b=>b.onclick=()=>{delete A.loved;finish()});
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>{
    if(view==="results"){view="quiz";step=active(Q.length-1)?Q.length-1:prevIdx(Q.length-1);lovedStage=0;recompute();renderQuiz();drawCloud();return}
    if(q&&q.special&&lovedStage){lovedStage--;renderQuiz();return}
    const pv=prevIdx(step);if(pv>=0)step=pv;renderQuiz()};
  const rs=document.getElementById("reset");if(rs)rs.onclick=()=>{for(const k in A)delete A[k];autoSurf=false;view="quiz";step=0;lovedStage=0;filt="all";recompute();drawCloud();renderQuiz()};
  const fw=document.getElementById("fwd");if(fw)fw.onclick=()=>{const nx=nextIdx(step);if(nx<0){finish();return}step=nx;renderQuiz()};
  const fn=document.getElementById("finish");if(fn)fn.onclick=()=>{if(A.loved&&A.loved.like==null)delete A.loved;finish()};
}
function finish(){view="results";recompute();filt="all";rsel=0;renderResults();drawCloud()}
function renderLoved(){
  if(lovedStage===0){
    const brands=[...new Set(S.filter(s=>s.pop).map(s=>s.brand))];
    ["Mizuno","PUMA","On","Altra","Li-Ning","Xtep"].forEach(b=>{if(!brands.includes(b))brands.push(b)});
    return `<div class="opts compact" style="--cols:5">${brands.map(b=>`<button class="opt" data-brand="${esc(b)}"><b>${esc(b)}</b></button>`).join("")}<button class="opt" data-none="1"><b>${t("neverHad")}</b></button></div>`;
  }
  if(lovedStage===1){
    const list=S.filter(s=>s.brand===lovedBrand).sort((a,b)=>(b.pop-a.pop)||(b.yr-a.yr)).slice(0,innerHeight<760?7:11);
    return `<p class="hint">${t("pickModel")} · ${esc(lovedBrand)}</p><div class="opts" style="--cols:4">${list.map(s=>`<button class="opt" data-shoe="${s.i}"><div class="art">${shoeArt(s)}</div><b>${esc(s.model)}</b><span>${s.yr}</span></button>`).join("")}<button class="opt" data-none="1"><b>${t("notHere")}</b></button></div>`;
  }
  const s=S[A.loved.i];
  return `<p class="hint">${t("howWas")} · ${esc(s.brand+" "+s.model)}</p><div class="opts" style="--cols:2"><button class="opt" data-like="1"><div class="art">${shoeArt(s)}</div><b>${t("loved")}</b></button><button class="opt" data-like="0"><div class="art" style="filter:grayscale(1);opacity:.6">${shoeArt(s)}</div><b>${t("hated")}</b></button></div>`;
}

/* ---------- results ---------- */
function filtered(){
  if(filt==="all")return ranked;
  if(filt==="budget")return finalize(pool,false,30).sort((a,b)=>a.usd-b.usd).slice(0,12);
  return finalize(pool.filter(s=>filt==="cn"?s.cn:(s.cur&&s.yr>=2026)),false,12)}
let rpage=0,rsel=0;
const cushOf=h=>h<30?"low":h<36?"medium":h<42?"high":"max";
const distTxt=d=>{const m={"5k":"5","10k":"10","21k":"21","42k":"42","ultra":"Ultra"};const a=m[d[0]],b=m[d[d.length-1]];return a===b?a+(a==="Ultra"?"":" km"):`${a}–${b}${b==="Ultra"?"":" km"}`};
function renderResults(){
  card.classList.remove("wide");card.classList.add("res");
  const list=ranked.slice(0,12),R=rt();
  // match %: the best shoe gets 98%, each point of score behind it costs about 1%
  const top=list.length?scores[list[0].i].sc:0;
  const pct=s=>Math.max(55,Math.min(98,Math.round(98-(top-scores[s.i].sc)*0.9)));
  if(!list.length){card.innerHTML=`<div class="rmain" style="display:block;padding:24px">${head(t("resTitle"),true)}<p class="empty">${t("none")}</p></div>`;wire(null);return}
  rsel=Math.min(rsel,list.length-1);
  // one tag per shoe: best match, lightest, cheapest, most cushioned
  const tags={};const tagOnce=(k,i)=>{if(i!=null&&!(i in tags))tags[i]=R.tags[k]};
  tagOnce("best",list[0].i);
  tagOnce("light",[...list].sort((a,b)=>a.g-b.g)[0].i);
  tagOnce("cheap",[...list].sort((a,b)=>a.usd-b.usd)[0].i);
  tagOnce("soft",[...list].sort((a,b)=>b.h-a.h)[0].i);
  const s=list[rsel],why=scores[s.i].w;
  const plate=s.plate==="none"?R.none:(T[L].plate[s.plate]||s.plate);
  const icons=`<button class="ibtn" data-act="back" aria-label="${t("back")}">${svgBack}</button><button class="ibtn" data-act="reset" aria-label="${t("reset")}">${svgReset}</button>`;
  card.innerHTML=`<div class="rwrap">
    <section class="rmain" aria-live="polite">
      <div class="rphoto"><span class="rbadge">${pct(s)}% ${esc(R.match)}</span>${shoeArt(s)}</div>
      <div class="rdet">
        <div><div class="rb">${esc(s.brand)}${!s.cur?` · ${esc(R.prev)}`:""}</div><h2>${esc(s.model)}</h2></div>
        <div class="rprice">$${s.usd}<small>${esc(R.price)}</small></div>
        <div class="tiles"><div class="tile"><span>${R.weight}</span><b>${s.g} g</b></div><div class="tile"><span>${R.drop}</span><b>${s.drop} mm</b></div></div>
        <dl class="spec">
          <dt>${R.stack}</dt><dd>${s.h} / ${s.f} mm</dd>
          <dt>${R.cushion}</dt><dd>${R.cush[cushOf(s.h)]}</dd>
          <dt>${R.feel}</dt><dd>${R.feelV[s.feel]}</dd>
          <dt>${R.stab}</dt><dd>${R.stabV[s.stab]}</dd>
          <dt class="y">${R.plate}</dt><dd class="y">${esc(plate)}</dd>
          <dt class="y">${R.surf}</dt><dd class="y">${R.surfV[s.surf]}</dd>
          <dt class="x">${R.dist}</dt><dd class="x">${distTxt(s.dist)}</dd>
          <dt class="x">${R.wide}</dt><dd class="x">${s.wide||s.brand==="Altra"||s.brand==="Topo Athletic"?R.yes:R.no}</dd>
          <dt class="x">${R.year}</dt><dd class="x">${s.yr}</dd>
        </dl>
        ${why.length?`<div class="rwhy">${why.map(k=>`<span>${esc(T[L].w[k])}</span>`).join("")}</div>`:""}
        <div class="rbtns">
          ${s.ali?`<a class="rbtn light" href="${esc(s.ali)}" target="_blank" rel="sponsored noopener">${esc(R.ali)} ↗</a>`:""}
          <span class="rbtn dark off">${esc(R.amz)}</span>
        </div>
        <div class="rpager">${icons}<span>${rsel+1} / ${list.length}${tags[s.i]?" · "+esc(tags[s.i]):""}</span><span style="display:flex;gap:2px"><button class="ibtn" id="pgPrev" aria-label="‹" ${rsel?"":"disabled"}>‹</button><button class="ibtn" id="pgNext" aria-label="›" ${rsel<list.length-1?"":"disabled"}>›</button></span></div>
      </div>
    </section>
    <aside class="rlist"><div class="rlhead">${icons}<b>${t("resTitle")}</b></div><div class="ritems"></div></aside>
  </div>`;
  // fill the shortlist with as many shoes as fit, no scrolling
  const box=card.querySelector(".ritems"),aside=card.querySelector(".rlist");
  const fit=aside.offsetParent?Math.max(3,Math.floor((aside.clientHeight-card.querySelector(".rlhead").offsetHeight-8)/64)):list.length;
  const shown=list.slice(0,fit);if(rsel>=shown.length&&aside.offsetParent)rsel=0;
  box.innerHTML=shown.map((x,k)=>`<button class="ritem" data-k="${k}" aria-current="${k===rsel}"><div class="th">${shoeArt(x)}</div><div class="tx"><b>${esc(x.brand+" "+x.model)}</b><span>$${x.usd} · ${pct(x)}%</span></div>${tags[x.i]?`<span class="rtag">${esc(tags[x.i])}</span>`:""}</button>`).join("");
  card.querySelectorAll(".ritem").forEach(b=>b.onclick=()=>{rsel=+b.dataset.k;renderResults()});
  const pp=document.getElementById("pgPrev"),pn=document.getElementById("pgNext");
  if(pp)pp.onclick=()=>{rsel--;renderResults()};if(pn)pn.onclick=()=>{rsel++;renderResults()};
  card.querySelectorAll('[data-act="back"]').forEach(b=>b.onclick=()=>{view="quiz";step=active(Q.length-1)?Q.length-1:prevIdx(Q.length-1);lovedStage=0;recompute();renderQuiz();drawCloud()});
  card.querySelectorAll('[data-act="reset"]').forEach(b=>b.onclick=()=>{for(const k in A)delete A[k];autoSurf=false;view="quiz";step=0;lovedStage=0;filt="all";rsel=0;recompute();drawCloud();renderQuiz()});
}

/* ---------- language & boot ---------- */
function applyLang(){
  const cur=LANGS.find(x=>x[0]===L);document.documentElement.lang=cur[2];
  document.getElementById("langCur").textContent=cur[1];
  document.getElementById("langBtn").setAttribute("aria-label",t("lang")+": "+cur[1]);
  document.getElementById("langMenu").innerHTML=LANGS.map(x=>`<li role="option" tabindex="0" data-l="${x[0]}" aria-selected="${x[0]===L}" lang="${x[2]}">${x[1]}</li>`).join("");
  document.getElementById("aboutBtn").textContent=t("about");document.getElementById("note").textContent=t("note");
  view==="quiz"?renderQuiz():renderResults();
}
const lb=document.getElementById("langBtn"),lm=document.getElementById("langMenu");
const closeMenu=()=>{lm.hidden=true;lb.setAttribute("aria-expanded","false")};
lb.onclick=e=>{e.stopPropagation();lm.hidden=!lm.hidden;lb.setAttribute("aria-expanded",String(!lm.hidden));if(!lm.hidden){const s=lm.querySelector('[aria-selected="true"]');s&&s.focus()}};
const pick=el=>{L=el.dataset.l;try{localStorage.setItem("fdf-lang",L)}catch(e){}closeMenu();applyLang();lb.focus()};
lm.onclick=e=>{const li=e.target.closest("li");if(li)pick(li)};
lm.onkeydown=e=>{const li=e.target.closest("li");if(!li)return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(li)}
  if(e.key==="ArrowDown"){e.preventDefault();(li.nextElementSibling||lm.firstElementChild).focus()}
  if(e.key==="ArrowUp"){e.preventDefault();(li.previousElementSibling||lm.lastElementChild).focus()}};
document.addEventListener("click",e=>{if(!lm.hidden&&!e.target.closest(".lang"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!lm.hidden){closeMenu();lb.focus()}});
const noteEl=document.getElementById("note"),aboutBtn=document.getElementById("aboutBtn");
aboutBtn.setAttribute("aria-expanded","false");
aboutBtn.onclick=e=>{e.stopPropagation();noteEl.hidden=!noteEl.hidden;aboutBtn.setAttribute("aria-expanded",String(!noteEl.hidden))};
document.addEventListener("click",e=>{if(!noteEl.hidden&&!e.target.closest("#note"))noteEl.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!noteEl.hidden){noteEl.hidden=true;aboutBtn.focus()}});
recompute();drawCloud();applyLang();
</script>
