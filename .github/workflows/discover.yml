name: Discover Chinese running shoes on AliExpress

# Report only: lists the Chinese running shoe models for sale on AliExpress.
on:
  workflow_dispatch:
    inputs:
      brands:
        description: "Only these brands, comma-separated (empty = all Chinese brands)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search AliExpress
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          DISCOVER_BRANDS: ${{ inputs.brands }}
        run: python scripts/aliexpress_discover.py
      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/aliexpress_discovery*.json
          git diff --cached --quiet || (git commit -m "Update AliExpress discovery report" && git push)
